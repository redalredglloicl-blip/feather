		D388BF3D322A8502591712DA /* Compile Zenith overlay dylibs */ = {
			isa = PBXShellScriptBuildPhase;
			alwaysOutOfDate = 1;
			buildActionMask = 2147483647;
			files = (
			);
			inputFileListPaths = (
			);
			inputPaths = (
			);
			outputFileListPaths = (
			);
			outputPaths = (
			);
			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "set -euo pipefail\n\n# Compile the three Zenith overlay dylibs (constructor-only, no main)\n# into the app bundle root, where the injectors look them up with\n# Bundle.main.url(forResource:withExtension: \"dylib\").\n# iOS only: the Mac Catalyst leg of the Makefile build has no use for\n# these dylibs and must skip cleanly.\nif [ \"${PLATFORM_NAME:-}\" != \"iphoneos\" ]; then\n  echo \"Zenith overlay dylibs: skipping (PLATFORM_NAME=${PLATFORM_NAME:-unknown}, not iphoneos)\"\n  exit 0\nfi\n\nSDKROOT=\"${SDKROOT:-$(xcrun --sdk iphoneos --show-sdk-path)}\"\n# The product path under BUILT_PRODUCTS_DIR is a symlink to the real\n# bundle under TARGET_BUILD_DIR (Xcode links it there); mkdir -p\n# through that symlink fails with ENOENT, so write to the real\n# directory directly - it is where the linker puts the executable.\nAPP_DIR=\"${TARGET_BUILD_DIR:-${BUILT_PRODUCTS_DIR}}/${PRODUCT_NAME}.app\"\necho \"Zenith overlay dylibs: APP_DIR=${APP_DIR}\"\nSRC_DIR=\"${SRCROOT}/Feather/Resources\"\n\nmkdir -p \"${APP_DIR}\"\n\nbuild_dylib() {\n  local name=\"$1\" src=\"$2\"; shift 2\n  echo \"Compiling ${name}.dylib ...\"\n  xcrun clang -dynamiclib -arch arm64 \\\n    -miphoneos-version-min=16.0 \\\n    -isysroot \"${SDKROOT}\" \\\n    -framework Foundation -framework UIKit -framework CoreGraphics \"$@\" \\\n    -o \"${APP_DIR}/${name}.dylib\" \\\n    \"${SRC_DIR}/${src}\"\n  test -f \"${APP_DIR}/${name}.dylib\"\n}\n\nbuild_dylib ZenithValueEditor ZenithValueEditor.m\nbuild_dylib ZenithFPS ZenithFPSOverlay.m -framework QuartzCore\nbuild_dylib ZenithTranslate ZenithTranslateOverlay.m\n\necho \"Zenith overlay dylibs built:\"\nls -l \"${APP_DIR}/ZenithValueEditor.dylib\" \"${APP_DIR}/ZenithFPS.dylib\" \"${APP_DIR}/ZenithTranslate.dylib\"";
		};
/* End PBXShellScriptBuildPhase section */

